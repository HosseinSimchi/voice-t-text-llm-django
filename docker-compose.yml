# CPU-only by default. GPU: see docker-compose.gpu.yml and README "GPU acceleration".
x-app: &app
  build: .
  image: audio-intelligence:latest
  env_file: .env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.prod
    DB_ENGINE: postgres
    POSTGRES_HOST: db
    REDIS_URL: redis://redis:6379/0
    CACHE_REDIS_URL: redis://redis:6379/1
    # Default: the Ollama already running on the host (saves ~2.5 GB of Docker memory).
    # With `--profile ollama`, set DOCKER_LLM_BASE_URL=http://ollama:11434 in .env.
    LLM_BASE_URL: ${DOCKER_LLM_BASE_URL:-http://host.docker.internal:11434}
    MEDIA_ROOT: /app/media
    LOG_DIR: /app/logs
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - media:/app/media
    - logs:/app/logs
    - models:/app/models
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_healthy}
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  web:
    <<: *app
    command: ["web"]
    # Listens on localhost only: Docker would otherwise publish the port on every interface and bypass the host
    # firewall. Put a TLS reverse proxy (see GUIDE.md) in front for public access, or set WEB_BIND=0.0.0.0.
    ports: ["${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8000}:8000"]

  worker:
    <<: *app
    command: ["worker"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 10 || exit 1"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s

  beat:
    <<: *app
    command: ["beat"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /app/media/.celerybeat-schedule || exit 1"]
      interval: 60s
      start_period: 60s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-audio_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-audio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # AOF persistence so queued tasks survive a Redis restart (the DB remains the source of truth).
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  ollama:
    # Optional: `docker compose --profile ollama up -d` (needs ~3 GB extra Docker memory).
    profiles: ["ollama"]
    image: ollama/ollama:0.12.6
    volumes: [ollama:/root/.ollama]
    environment:
      OLLAMA_KEEP_ALIVE: 10m
    restart: unless-stopped
    # Not published to the host: only the worker talks to it on the internal network.

volumes:
  media:
  logs:
  models:
  pgdata:
  redisdata:
  ollama:
