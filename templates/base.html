{% load static %}<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}پلتفرم هوشمند پردازش صوت فارسی{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 font-sans antialiased">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-3xl items-center justify-between px-4 py-4">
      <a href="{% url 'web-index' %}" class="text-lg font-bold text-blue-900">پلتفرم هوشمند پردازش صوت فارسی</a>
      <span class="text-xs text-slate-500">رونویسی · PDF · استخراج اطلاعات</span>
    </div>
  </header>
  <main class="mx-auto max-w-3xl px-4 py-8">{% block content %}{% endblock %}</main>
  <footer class="mx-auto max-w-3xl px-4 pb-8 text-center text-xs text-slate-400">
    پردازش به‌صورت محلی و بدون سرویس ابری انجام می‌شود.
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
